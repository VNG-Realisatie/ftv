<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>ODRL-viewer — verplaatst naar index.html</title>
<!--
  DE OUDE INGANG, ALS DOORSTUURBESTAND (deeltraject 4, golf 2).

  Tot de omschakeling was `viewer/doc.html` DE viewer. Sindsdien staat de nieuwe
  app op dezelfde plek, en die heet `index.html`. Alles wat buiten dit repository
  naar de oude naam wijst — de voorbeeldlinks op de projectpagina, de deeplinks
  in de profieldocumentatie, wat er in presentaties en mail is rondgestuurd —
  blijft daarmee werken.

  HET URL-CONTRACT IS AL BYTE-COMPATIBEL: `src/stores/weergave.ts` leest exact
  dezelfde twaalf sleutels als het boot-blok van de bevroren viewer. Alleen de
  bestandsnaam verschilt. Dit bestand hoeft dus niets te VERTALEN; het hoeft
  alleen niets te VERLIEZEN.

  Daarom `location.search + location.hash` ONGELEZEN doorgeven. Wie de query hier
  uit elkaar haalt en opnieuw opbouwt, codeert vroeg of laat een teken anders dan
  de afzender het schreef — en `?src=` draagt hele URL's, mét `%3A%2F%2F`. De
  hash hoort er net zo goed bij: een deeplink naar een kop in het document valt
  zonder hem terug op de bovenkant van de pagina.

  `replace` en niet `assign`: de oude URL blijft dan GEEN eigen stap in de
  geschiedenis. Met `assign` zet één keer terug de lezer op dit bestand, dat hem
  meteen weer vooruit stuurt — de klassieke redirect-lus in de terugknop.

  Het pad is relatief (`index.html`, geen `/viewer/index.html`): net als de rest
  van de build is dit bestand pad-onafhankelijk, zodat het ook werkt waar de app
  niet in de wortel van een host staat.

  Dit bestand staat in `src/public/` en wordt door Vite verbatim in de build
  gekopieerd; `test/e2e/gevallen/doc-shim.mjs` pint dat het er is en wat het doet.
  Sloop is golf 4, niet eerder: de deeplinks van buiten zijn niet op te sporen.
-->
<meta name="robots" content="noindex">
<script>
  location.replace('index.html' + location.search + location.hash);
</script>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 3rem auto; max-width: 34rem; padding: 0 1rem; }
</style>
</head>
<body>
<noscript>
  <p>Deze viewer heeft JavaScript nodig. De pagina is verhuisd naar
  <a href="index.html">index.html</a> in dezelfde map; de parameters achter het
  vraagteken werken daar ongewijzigd.</p>
</noscript>
</body>
</html>
